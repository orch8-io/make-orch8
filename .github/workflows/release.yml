name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Tag must match package.json version
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - run: npm test
      - name: Zip the app definition
        run: |
          name="make-orch8-$GITHUB_REF_NAME"
          mkdir -p "dist/$name"
          cp -R makecomapp.json general connections modules rpcs webhooks README.md LICENSE "dist/$name/"
          (cd dist && zip -r "$name.zip" "$name")
          unzip -l "dist/$name.zip"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/make-orch8-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
